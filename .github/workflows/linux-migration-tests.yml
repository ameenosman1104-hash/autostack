name: AutoStack Linux migration and quotation tests

# Manual only: runs when started from the Actions tab. Never runs on push or pull request.
"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test (for example release/quotations-candidate)"
        required: true
        default: "release/quotations-candidate"
        type: string

permissions:
  contents: read

concurrency:
  group: linux-migration-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUTOSTACK_ENV: test
      TESTING: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout the selected ref (read-only, no credentials kept)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Show the tested commit
        run: git log --oneline -1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install application requirements and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1

      - name: Run migration, startup-gate and quotation tests on Linux
        run: |
          python -m pytest \
            tests/test_migration_backups.py \
            tests/test_migration_concurrency.py \
            tests/test_startup_gate.py \
            tests/test_supplier_invoices_phase2.py \
            tests/test_quotations.py \
            -v -p no:cacheprovider -rs
