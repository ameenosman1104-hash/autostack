<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — Autostack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#1a1a1a; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { border:1px solid #2a2a2a; border-radius:12px; padding:2.5rem; width:100%; max-width:440px; box-shadow:0 8px 32px rgba(0,255,100,0.1); background:#242424; }
    .card .text-muted { color:#a0a0a0 !important; }
    .logo { color:#00ff64; font-size:2rem; font-weight:800; }
    label { color:#e0e0e0; }
    .form-control { background:#1a1a1a; border:1px solid #2a2a2a; color:#fff; }
    .form-control::placeholder { color:#a0a0a0; }
    .form-control:focus { background:#1a1a1a; border-color:#00ff64; color:#fff; box-shadow:0 0 8px rgba(0,255,100,0.2); }
    .btn-create { background:#00ff64; border:none; font-weight:600; padding:.65rem; color:#1a1a1a; transition:all 0.2s ease; }
    .btn-create:hover { background:#00e55c; box-shadow:0 0 12px rgba(0,255,100,0.3); }
    .alert-danger { background:rgba(239,68,68,0.1); color:#ff6b6b; border:1px solid #ef4444; }
    .alert-success { background:rgba(34,197,94,0.1); color:#22c55e; border:1px solid #22c55e; }
    .text-primary { color:#00ff64 !important; }
  </style>
</head>
<body>
  <div class="card bg-white">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="Autostack" style="height:80px; margin-bottom:1rem;">
      <div class="text-muted" style="font-size:.85rem;">Create your shop account</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ 'danger' if cat=='danger' else 'success' }} py-2">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Business Name *</label>
        <input type="text" name="business_name" class="form-control" placeholder="e.g. Osbro Tyres" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Username *</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" placeholder="your@email.com">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password *</label>
        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Confirm Password *</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-create btn-primary w-100 text-white mb-3">Create Account</button>
      <div class="text-center" style="font-size:.88rem;">
        Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Sign in</a>
      </div>
    </form>
  </div>
</body>
</html>
